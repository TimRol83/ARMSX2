# Unified "build everything on every commit" pipeline for the single-core monorepo.
#
# One push to the default branch fans out to every supported target and uploads
# an individual binary artifact per platform:
#   * PC arm64 Qt GUI  -> macOS, Linux, Windows  (reuses the reusable workflows)
#   * Android APK       -> platforms/android  (Gradle + NDK, thin CMake on root core)
#   * iOS .app          -> platforms/ios      (Xcode/CMake on root core)
#
# Windows-on-arm64 builds natively on a Windows 11 arm64 runner (see
# windows_build_qt.yml): a single arm64 deps stage, then the arm64 GUI.
#
# NOTE: The Android and iOS jobs build against the freshly-collapsed single core
# and have not yet had a green run; they are the mechanism that will surface the
# remaining reconciliation work. Keep them non-blocking until they first pass.
#
# INVARIANT (do not weaken): the PC arm64 jobs (pc-macos-arm64 / pc-linux-arm64 /
# pc-windows-arm64) are BLOCKING and must stay so. They are the guardrail that a
# mobile-motivated change has not silently altered the shared canonical core.
# Anything mobile-specific belongs behind a platform guard (#if __ANDROID__ /
# ARMSX2_IOS) or in a forked, CMake-selected translation unit (see the aR5900*
# EE fork in pcsx2/CMakeLists.txt) -- never grafted unguarded into shared files.
name: Build All Platforms

on:
  push:
    branches:
      - main
    # Doc-only pushes shouldn't burn ~2h of arm64 CI.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (arm64, unsigned device IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # librashader is built by cargo for iOS; without this target CMake turns shader
      # support off and the app hides Shaders, while the build still passes.
      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      # The core is cached by committed content and saved before the client identity is
      # written, so no cache or key holds it.
      - name: Install Ninja
        run: brew install ninja

      # The runner image is in the key because the precompiled header records the mtime of every
      # SDK header it read, and each macOS image installs the SDK with its own mtimes. A core
      # built on one image fails to compile on the other ("has been modified since the
      # precompiled header was built").
      - name: Compute the core cache key
        id: core-key
        run: echo "key=ios-core-device-$({ xcodebuild -version; echo "${ImageOS:-}-${ImageVersion:-}"; cmake --version | head -1; ninja --version; rustc --version; git rev-parse HEAD:pcsx2 HEAD:common HEAD:3rdparty HEAD:cmake HEAD:bin/resources/shaders HEAD:platforms/android/app/src/main/cpp/3rdparty HEAD:platforms/ios/CMakeLists.txt HEAD:platforms/ios/cmake HEAD:platforms/ios/3rdparty HEAD:platforms/ios/patches HEAD:platforms/ios/scripts/build-ios-core.sh; } | shasum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Restore the prebuilt core
        id: core-cache
        uses: actions/cache/restore@v6
        with:
          path: platforms/ios/build/core-device
          key: ${{ steps.core-key.outputs.key }}

      # A restored core is older than a fresh checkout, so Ninja would rebuild all of it. The
      # checkout is aged on a miss too, since a precompiled header rejects any header whose
      # mtime differs from the one it was built against.
      - name: Age the checkout behind the prebuilt core
        run: find . -path ./.git -prune -o -path ./platforms/ios/build -prune -o -exec touch -h -t 200001010000 {} +

      - name: Build the prebuilt core
        run: platforms/ios/scripts/build-ios-core.sh device

      - name: Save the prebuilt core
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: platforms/ios/build/core-device
          key: ${{ steps.core-key.outputs.key }}

      # RetroAchievements grants hardcore by the client name and version in the user agent,
      # which pcsx2/Host.cpp reads from a gitignored header. Only master builds get it; pull
      # request builds keep the stock PCSX2 agent and stay softcore.
      - name: Embed the RetroAchievements client identity
        if: >-
          github.repository == 'ARMSX2/ARMSX2' &&
          github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IOS_RA_UA_VERSION: ${{ secrets.IOS_RA_UA_VERSION }}
        run: bash .github/workflows/scripts/common/write-ra-ua-secret.sh

      - name: Configure (CMake, Xcode generator, real device SDK, no signing)
        working-directory: platforms/ios
        run: >
          cmake -G Xcode -B build/device
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DARMSX2_REAL_DEVICE=ON

      - name: Build (iphoneos SDK, unsigned)
        working-directory: platforms/ios
        run: >
          cmake --build build/device --config Release
          -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned .ipa
        working-directory: platforms/ios
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IPA_NAME="ARMSX2-iOS-${SHORT_SHA}.ipa"

          APP_PATH=$(find build/device -name "ARMSX2iOS.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ARMSX2iOS.app not found in build output"
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          echo "Packaging as: $IPA_NAME"

          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"

          cd "$STAGING"
          zip -r "$GITHUB_WORKSPACE/$IPA_NAME" Payload -x "*.DS_Store"
          cd "$GITHUB_WORKSPACE"

          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -lh "$IPA_NAME"

      # The client doesn't report a rejected agent, so fail when the identity is missing.
      # Same guard as the write step, so pull requests skip it.
      - name: Verify the client identity reached the binary
        if: >-
          github.repository == 'ARMSX2/ARMSX2' &&
          github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: platforms/ios
        env:
          IOS_RA_UA_VERSION: ${{ secrets.IOS_RA_UA_VERSION }}
        run: |
          APP_PATH=$(find build/device -name "ARMSX2iOS.app" -type d | head -1)
          bash "$GITHUB_WORKSPACE/.github/workflows/scripts/common/verify-ra-ua-agent.sh" \
            "$APP_PATH/ARMSX2iOS"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ github.workspace }}/${{ env.IPA_NAME }}
          if-no-files-found: error

  # ---- Alert on a broken master build ------------------------------------
  # Fires only when a BLOCKING guardrail job (the PC arm64 builds) fails on a
  # push to master -- never on PRs, and never on the mobile jobs, which the
  # `needs` below does not name and so cannot trip `failure()`. GitHub also
  # emails the pusher natively; this adds a Discord ping to the shared channel.
